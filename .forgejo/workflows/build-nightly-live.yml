name: Build nightly Live ISO

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 5'

jobs:
  live-iso:
    name: Build and publish Live ISO
    runs-on: als-huge
    container:
      image: altlinux.space/alt-atomic/builder-image:sisyphus

    steps:
    - name: Build and publish Live ISO
      id: live_iso
      uses: alt-atomic/actions/live-iso@fed21a21ea3491b4e2a5a24100d10885ed7daa48
      with:
        image: altlinux.space/${{ github.repository }}/nightly:latest
        embed-image: |
          altlinux.space/${{ github.repository }}/nightly:latest
        output: onyx-live-nightly.iso
        upload-enabled: true
        registry-password: ${{ secrets.REGISTRY_TOKEN }}
        package-version: latest
