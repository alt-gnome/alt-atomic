name: Publish release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

env:
  REGISTRY: altlinux.space

jobs:
  release:
    name: Publish release
    runs-on: als-tiny
    container:
      image: altlinux.space/alt-atomic/builder-image:sisyphus@sha256:780a04c1a9bd49e21734edb003642a0e19132ff1971d4cea301912a6376b309f
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        fetch-depth: 0
        fetch-tags: true
        token: ${{ secrets.ATOMIC_BOT_REPO2 }}

    - name: Get tag
      id: get_tag
      uses: alt-atomic/actions/get-tag@e835eedfc64536d16df2a43259d034c5cb25e8ce
      with:
        desired-tag: ${{ github.ref_name }}

    - id: get_images
      name: Get images
      run: |
        echo "image=${{ env.REGISTRY }}/${{ github.repository }}/rc:${{ steps.get_tag.outputs.commit }}" >> $FORGEJO_OUTPUT
        echo "image-nv=${{ env.REGISTRY }}/${{ github.repository }}-nvidia/rc:${{ steps.get_tag.outputs.commit }}" >> $FORGEJO_OUTPUT

    - name: Check image existence
      run: |
        if skopeo inspect docker://${{ steps.get_images.outputs.image }} &>/dev/null && \
           skopeo inspect docker://${{ steps.get_images.outputs.image-nv }} &>/dev/null; then
          exit 0
        else
          echo "Image does not exist, deleting tag ${{ github.ref_name }}"
          git config user.name "CI Bot"
          git config user.email "ci@altlinux.space"

          git tag -d "${{ github.ref_name }}"
          git push origin --delete "${{ github.ref_name }}"
          exit 1
        fi

    - name: Copy default image
      uses: alt-atomic/actions/release@e835eedfc64536d16df2a43259d034c5cb25e8ce
      with:
        registry: ${{ env.REGISTRY }}
        registry-username: "<token>"
        registry-password: ${{ secrets.REGISTRY_TOKEN }}
        image-from: docker://${{ steps.get_images.outputs.image }}
        image-name-to: ${{ github.repository }}/stable
        image-tag: latest
        image-aliases: ${{ steps.get_tag.outputs.tag }} ${{ steps.get_tag.outputs.release }}
        cosign-image-sign: ${{ secrets.IMAGE_SIGN }}
        cosign-password: ${{ secrets.COSIGN_PASSWORD }}

    - name: Copy nvidia image
      uses: alt-atomic/actions/release@e835eedfc64536d16df2a43259d034c5cb25e8ce
      with:
        registry: ${{ env.REGISTRY }}
        registry-username: "<token>"
        registry-password: ${{ secrets.REGISTRY_TOKEN }}
        image-from: docker://${{ steps.get_images.outputs.image-nv }}
        image-name-to: ${{ github.repository }}-nvidia/stable
        image-tag: latest
        image-aliases: ${{ steps.get_tag.outputs.tag }} ${{ steps.get_tag.outputs.release }}
        cosign-image-sign: ${{ secrets.IMAGE_SIGN }}
        cosign-password: ${{ secrets.COSIGN_PASSWORD }}

    - name: Get changes between tags
      id: changes
      uses: https://github.com/simbo/changes-between-tags-action@d928245922fdac861c45da7176178040533b92e0 # v1
      with:
        tag-pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
        include-hashes: false

    - name: Publish release
      id: create_release
      uses: https://github.com/softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
      with:
        tag_name: ${{ steps.changes.outputs.tag }}
        name: "Release ${{ steps.changes.outputs.tag }}"
        body: "${{ steps.changes.outputs.changes }}"
        draft: false
        prerelease: false
        token: ${{ secrets.GITHUB_TOKEN }}
