image: ${{ Env.IMAGE }}

modules:
  - type: include
    body:
      targets:
        - update.yml

  - name: Set branding
    type: branding
    body:
      build-type: ${{ Env.IMAGE_TYPE }}
      release-overrides:
        VERSION: ${{ Env.VERSION }}
        IMAGE_ID: alt-atomic-onyx-nvidia
        VARIANT: NVIDIA
        VARIANT_ID: nvidia

  - type: include
    body:
      targets:
        - /usr/share/apm/includes/common/nvidia.yml
        - kernel.yml
        - /usr/share/apm/includes/common/cleanup.yml
