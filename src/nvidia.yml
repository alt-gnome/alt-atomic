image: ${{ Env.IMAGE }}

modules:
  - type: include
    body:
      targets:
        - update.yml

  - name: Set branding
    type: branding
    body:
      release-overrides:
        VARIANT: Onyx (Nvidia)
        VARIANT_ID: onyx-nvidia

  - type: include
    body:
      targets:
        - /usr/share/apm/includes/common/nvidia.yml
        - kernel.yml
        - /usr/share/apm/includes/common/cleanup.yml
