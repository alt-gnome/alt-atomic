modules:
  - name: Add repos
    type: repos
    body:
      name: atomic-installer-nightly
      custom:
        - rpm https://altlinux.space/api/packages/alt-atomic/alt/group/ready-set-plugin-atomic-installer-nightly/sisyphus.repo _arch_ classic
        - rpm https://altlinux.space/api/packages/alt-atomic/alt/group/installer-nightly/sisyphus.repo _arch_ classic

  - name: Install
    type: packages
    body:
      install:
        - installer
        - ready-set-plugin-atomic-installer

  - name: Create links
    type: link
    body:
      target: /usr/lib/systemd/user/gnome-session.target.wants/atomic-installer.service
      to: ../atomic-installer.service
