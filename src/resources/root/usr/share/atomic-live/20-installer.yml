modules:
  - name: Add atomic-installer nightly repo
    type: repos
    body:
      name: atomic-installer-nightly
      custom:
        - rpm https://altlinux.space/api/packages/alt-atomic/alt/group/atomic-installer-nightly/sisyphus.repo x86_64 classic

  - name: Install atomic-installer
    type: packages
    body:
      install:
        - atomic-installer

  - name: Offer the embedded image in the installer
    type: shell
    body:
      command: bash scripts/installer-images.sh
