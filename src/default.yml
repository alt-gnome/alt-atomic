image: ${{ Env.IMAGE }}

modules:
  - name: 0.6 Maintenance tasks
    type: repos
    body:
      tasks:
        # Tuner crash on `About application`
        - 439495
        # Tailor crash on `About application`
        - 439485
        # ReadySet `existing-user-mode-enabled` doesn't work in live iso
        - 440445

  - name: Install packages
    type: include
    body:
      targets:
        - packages.yml

  - name: Set branding
    type: branding
    body:
      name: alt-atomic-${{ Env.IMAGE_NAME }}
      build-type: ${{ Env.IMAGE_TYPE }}
      release-overrides:
        VERSION_ID: ${{ Env.VERSION }}
        VARIANT: ""
        VARIANT_ID: ""

  - name: Copy root
    type: copy
    body:
      source: root
      destination: /
      replace: true

  - type: include
    body:
      targets:
        - network.yml
        - systemd.yml
        - settings.yml
        - kernel.yml
        - /usr/share/apm/includes/common/cleanup.yml
