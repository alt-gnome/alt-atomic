name: Network
description: NetworkManager brought the interface up, the guest has DNS and internet access

steps:
  - name: default route exists
    run: ip route show default
    wait: 60s
    expect:
      stdout: "default via"
    on-fail: nmcli device status; ip addr

  - name: DNS and HTTPS work
    run: curl -fsS --max-time 10 -o /dev/null https://altlinux.space
    continue: true
    on-fail: cat /etc/resolv.conf; nmcli general status

  - name: avahi is active
    run: systemctl is-active avahi-daemon
