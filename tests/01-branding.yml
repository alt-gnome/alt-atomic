name: Branding
description: /etc/os-release names Onyx and matches the release type

steps:
  - name: ID names onyx
    run: . /etc/os-release && echo "$ID"
    expect:
      stdout: "~^alt-atomic-onyx(-nightly)?$"
    on-fail: cat /etc/os-release

  - name: variant is absent or NVIDIA
    run: . /etc/os-release && printf '%s:%s\n' "${VARIANT-}" "${VARIANT_ID-}"
    expect:
      stdout: "~^(:|NVIDIA:nvidia)$"

  - name: nightly is marked as development
    only:
      RELEASE_TYPE: [ development ]
    run: . /etc/os-release && echo "$ID"
    expect:
      stdout: alt-atomic-onyx-nightly

  - name: stable ID has no release suffix
    only:
      RELEASE_TYPE: [ stable ]
    run: . /etc/os-release && echo "$ID"
    expect:
      stdout: alt-atomic-onyx

  - name: VERSION_ID matches IMAGE_VERSION
    run: . /etc/os-release && test "$VERSION_ID" = "$IMAGE_VERSION"
    on-fail: grep -E '^(VERSION_ID|IMAGE_VERSION|BUILD_ID)=' /etc/os-release

  - name: hostname comes from the image
    run: hostname
    expect:
      stdout: "~^alt-atomic"
